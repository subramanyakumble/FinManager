name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir -p work
          unzip -q FinManager.zip -d work
          ls -R work | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: work/FinManager
      - uses: actions/upload-artifact@v4
        with:
          name: FinManager-APK
          path: work/FinManager/app/build/outputs/apk/debug/app-debug.apk
